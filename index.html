<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>STACKLY — Loading</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:      #080d14;
      --cyan:    #00e5ff;
      --cyan-d:  #00b8cc;
      --green:   #00e676;
      --border:  #1a3050;
      --text-1:  #e8f4fb;
      --text-2:  #7a9bb5;
      --text-3:  #3d607a;
      --mono:    'Space Mono', monospace;
      --sans:    'Space Grotesk', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--sans);
      color: var(--text-1);
    }

    /* ── GRID OVERLAY ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }

    /* ── WRAPPER ── */
    #loader {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--bg);
      transition: opacity .6s ease, transform .6s ease;
    }
    #loader.exit {
      opacity: 0;
      pointer-events: none;
    }

    /* ── RADAR ── */
    .radar-wrap {
      position: relative;
      width: 220px; height: 220px;
      margin-bottom: 48px;
      flex-shrink: 0;
    }
    .radar-ring {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid var(--border);
    }
    .r1 { width: 60px;  height: 60px; }
    .r2 { width: 110px; height: 110px; }
    .r3 { width: 165px; height: 165px; }
    .r4 { width: 220px; height: 220px; }

    /* Sweep */
    .radar-sweep {
      position: absolute; top: 50%; left: 50%;
      width: 110px; height: 110px;
      transform-origin: 0 0;
      background: conic-gradient(from 0deg, transparent 300deg, rgba(0,229,255,.35) 360deg);
      border-radius: 0 50% 50% 0 / 0 50% 50% 0;
      animation: sweep 2s linear infinite;
    }
    @keyframes sweep { to { transform: rotate(360deg); } }

    /* Dots */
    .radar-dot {
      position: absolute;
      width: 7px; height: 7px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyan);
      animation: blink 2s ease-in-out infinite;
    }
    .d1 { top: 22%; left: 62%; animation-delay: .4s; }
    .d2 { top: 58%; left: 30%; animation-delay: 1.1s; }
    .d3 { top: 38%; left: 70%; animation-delay: .7s; }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: .15; }
    }

    /* Centre dot */
    .radar-center {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 10px; height: 10px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 14px var(--cyan);
    }

    /* ── LOGO ── */
    .logo {
      display: flex; align-items: center; gap: 10px;
      width: 200px;
      height: 60px;
      margin-bottom: 10px;
      animation: fade-up .6s ease both;
    }
    .logo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes pulse-dot {
      0%,100% { box-shadow: 0 0 0 0 rgba(0,229,255,.5); }
      50%      { box-shadow: 0 0 0 7px rgba(0,229,255,0); }
    }

    .tagline {
      font-family: var(--mono); font-size: .68rem;
      letter-spacing: .2em; text-transform: uppercase;
      color: var(--text-2); margin-bottom: 52px;
      animation: fade-up .6s .1s ease both;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── PROGRESS BAR ── */
    .progress-wrap {
      width: min(320px, 80vw);
      animation: fade-up .5s .2s ease both;
    }
    .progress-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .progress-status {
      font-family: var(--mono); font-size: .68rem;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--text-2); transition: color .3s;
    }
    .progress-pct {
      font-family: var(--mono); font-size: .72rem;
      color: var(--cyan); font-weight: 700;
    }

    .progress-track {
      width: 100%; height: 3px;
      background: var(--border); border-radius: 2px;
      overflow: hidden; position: relative;
    }
    .progress-fill {
      height: 100%; width: 0%;
      border-radius: 2px;
      background: var(--cyan);
      transition: width .08s linear;
      position: relative;
    }
    /* Sheen on fill */
    .progress-fill::after {
      content: '';
      position: absolute; top: 0; right: 0;
      width: 30px; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.5));
    }

    /* Segment ticks */
    .progress-ticks {
      display: flex; justify-content: space-between;
      margin-top: 8px;
    }
    .tick {
      font-family: var(--mono); font-size: .58rem;
      color: var(--text-3); letter-spacing: .05em;
    }

    /* ── STEP LIST ── */
    .steps {
      margin-top: 32px; display: flex; flex-direction: column; gap: 10px;
      width: min(320px, 80vw);
      animation: fade-up .5s .3s ease both;
    }
    .step {
      display: flex; align-items: center; gap: 12px;
      font-family: var(--mono); font-size: .7rem;
      letter-spacing: .06em; text-transform: uppercase;
      color: var(--text-3);
      transition: color .3s;
    }
    .step.done   { color: var(--green); }
    .step.active { color: var(--cyan); }

    .step-icon {
      width: 18px; height: 18px; flex-shrink: 0;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: .6rem;
      transition: all .3s;
    }
    .step.done .step-icon {
      background: rgba(0,230,118,.12);
      border-color: var(--green);
      color: var(--green);
    }
    .step.active .step-icon {
      background: rgba(0,229,255,.12);
      border-color: var(--cyan);
      color: var(--cyan);
      animation: spin-dot 1s linear infinite;
    }
    @keyframes spin-dot {
      to { transform: rotate(360deg); }
    }

    /* ── TICKER STRIP ── */
    .ticker-strip {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 36px; background: rgba(8,13,20,.9);
      border-top: 1px solid var(--border);
      overflow: hidden; z-index: 20;
      display: flex; align-items: center;
    }
    .ticker-inner {
      display: flex; width: max-content;
      animation: ticker 18s linear infinite;
    }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .ticker-item {
      display: flex; align-items: center; gap: 8px;
      padding: 0 36px;
      font-family: var(--mono); font-size: .66rem;
      color: var(--text-2); white-space: nowrap;
    }
    .ticker-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); flex-shrink: 0; }

    /* ── CORNER DECOR ── */
    .corner {
      position: fixed; width: 40px; height: 40px;
      pointer-events: none; z-index: 5;
    }
    .corner svg { position: absolute; inset: 0; }
    .corner-tl { top: 12px; left: 12px; }
    .corner-tr { top: 12px; right: 12px; transform: scaleX(-1); }
    .corner-bl { bottom: 48px; left: 12px; transform: scaleY(-1); }
    .corner-br { bottom: 48px; right: 12px; transform: scale(-1); }

    /* ── MOBILE ── */
    @media (max-width: 480px) {
      .radar-wrap { width: 180px; height: 180px; }
      .r4 { width: 180px; height: 180px; }
      .r3 { width: 135px; height: 135px; }
      .r2 { width: 90px;  height: 90px; }
      .r1 { width: 50px;  height: 50px; }
      .logo { font-size: 1.15rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

<!-- Corner brackets -->
<div class="corner corner-tl">
  <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 18 L2 2 L18 2" stroke="#1a3050" stroke-width="1.5"/>
  </svg>
</div>
<div class="corner corner-tr">
  <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 18 L2 2 L18 2" stroke="#1a3050" stroke-width="1.5"/>
  </svg>
</div>
<div class="corner corner-bl">
  <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 18 L2 2 L18 2" stroke="#1a3050" stroke-width="1.5"/>
  </svg>
</div>
<div class="corner corner-br">
  <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 18 L2 2 L18 2" stroke="#1a3050" stroke-width="1.5"/>
  </svg>
</div>

<!-- Main loader -->
<div id="loader">

  <!-- Radar animation -->
  <div class="radar-wrap">
    <div class="radar-ring r1"></div>
    <div class="radar-ring r2"></div>
    <div class="radar-ring r3"></div>
    <div class="radar-ring r4"></div>
    <div class="radar-sweep"></div>
    <div class="radar-dot d1"></div>
    <div class="radar-dot d2"></div>
    <div class="radar-dot d3"></div>
    <div class="radar-center"></div>
  </div>

  <!-- Logo -->
  <div class="logo">
     <img src="./src/Untitled design-compressed.webp" alt="">
  </div>
  <div class="tagline">Logistics Intelligence Platform</div>

  <!-- Progress bar -->
  <div class="progress-wrap">
    <div class="progress-header">
      <span class="progress-status" id="statusText">Initializing systems</span>
      <span class="progress-pct" id="pctText">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-ticks">
      <span class="tick">0%</span>
      <span class="tick">25%</span>
      <span class="tick">50%</span>
      <span class="tick">75%</span>
      <span class="tick">100%</span>
    </div>
  </div>

  <!-- Step list -->
  <div class="steps" id="stepList"></div>

</div>

<!-- Ticker -->
<div class="ticker-strip">
  <div class="ticker-inner" id="ticker"></div>
</div>

<script>
const STEPS = [
  { label: 'Connecting to carrier network',   dur: 600  },
  { label: 'Loading fleet telemetry',          dur: 700  },
  { label: 'Fetching live shipment data',       dur: 650  },
  { label: 'Calibrating route optimizer',       dur: 600  },
  { label: 'All systems ready',                 dur: 450  },
];

const STATUSES = [
  'Initializing systems',
  'Authenticating API keys',
  'Syncing carrier feeds',
  'Building route index',
  'Launching dashboard',
];

const TICKER_ITEMS = [
  'TF-884729K · IN TRANSIT · ETA 14:30',
  'TF-334501X · DELIVERED · Chennai Hub',
  'TF-991023Z · ON SCHEDULE · Delta +0m',
  'Fleet Efficiency · 94.2% · This Week',
  'Route Optimizer · Saved 2,840 km · Today',
  'API Status · All Systems Operational',
  'TF-V003 [!] LOW FUEL · Action Required',
  'Live tracking active · 14,827 shipments',
];

/* ── TICKER ── */
const tickerEl = document.getElementById('ticker');
const allTicker = [...TICKER_ITEMS, ...TICKER_ITEMS];
tickerEl.innerHTML = allTicker.map(t =>
  `<div class="ticker-item"><span class="ticker-dot"></span>${t}</div>`
).join('');

/* ── STEPS ── */
const stepList = document.getElementById('stepList');
STEPS.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'step';
  el.id = 'step-' + i;
  el.innerHTML = `<div class="step-icon" id="icon-${i}"></div><span>${s.label}</span>`;
  stepList.appendChild(el);
});

/* ── PROGRESS ENGINE ── */
const TOTAL = 3000;
const fill   = document.getElementById('progressFill');
const pctEl  = document.getElementById('pctText');
const statEl = document.getElementById('statusText');
const loader = document.getElementById('loader');

let start = null;
let stepIndex = 0;
let stepStart = 0;
const stepBreaks = STEPS.reduce((acc, s, i) => {
  acc.push((acc[i - 1] || 0) + s.dur);
  return acc;
}, []);

function setStep(i, state) {
  const el = document.getElementById('step-' + i);
  const ic = document.getElementById('icon-' + i);
  if (!el) return;
  el.className = 'step ' + state;
  ic.textContent = state === 'done' ? '✓' : state === 'active' ? '◌' : '';
}

function tick(ts) {
  if (!start) start = ts;
  const elapsed = Math.min(ts - start, TOTAL);
  const pct = Math.floor((elapsed / TOTAL) * 100);

  fill.style.width = pct + '%';
  pctEl.textContent = pct + '%';

  // Update status text
  const statusIdx = Math.min(Math.floor(pct / 20), STATUSES.length - 1);
  statEl.textContent = STATUSES[statusIdx];

  // Step states
  for (let i = 0; i < STEPS.length; i++) {
    const threshold = (stepBreaks[i] / TOTAL) * 100;
    const prevThreshold = i > 0 ? (stepBreaks[i - 1] / TOTAL) * 100 : 0;
    if (pct >= threshold) {
      setStep(i, 'done');
    } else if (pct >= prevThreshold) {
      setStep(i, 'active');
    }
  }

  if (elapsed < TOTAL) {
    requestAnimationFrame(tick);
  } else {
    fill.style.width = '100%';
    pctEl.textContent = '100%';
    statEl.textContent = 'All systems ready';
    STEPS.forEach((_, i) => setStep(i, 'done'));

    setTimeout(() => {
      loader.classList.add('exit');
      setTimeout(() => {
        loader.style.display = 'none';
      window.location.href = 'home.html';
      }, 650);
    }, 400);
  }
}

requestAnimationFrame(tick);
</script>
</body>
</html>
